plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.walton.acremote"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.walton.acremote"
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystoreFile = file("upload-keystore.jks")
            if (!keystoreFile.exists()) {
                keystoreFile = file("../../upload-keystore.jks")
            }
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword(System.getenv("KEYSTORE_PASSWORD") ?: "walton_ac_remote_key")
                keyAlias(System.getenv("KEY_ALIAS") ?: "waltonac")
                keyPassword(System.getenv("KEY_PASSWORD") ?: "walton_ac_remote_key")
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
